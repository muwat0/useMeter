name: Bug Report
description: Report an issue or unexpected behavior in useMeter
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you do **NOT** include API keys, passwords, bearer tokens, or sensitive credentials anywhere in your report.
  - type: input
    id: version
    attributes:
      label: useMeter Version
      description: What version of useMeter are you running? (Shown in footer or `/health`)
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Environment
      description: How is useMeter deployed?
      options:
        - Docker Compose
        - Local Bun service
        - Other (specify below)
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected AI Provider (if applicable)
      description: Select the provider involved in the issue
      options:
        - None / Core Application
        - Anthropic (Claude)
        - Codex
        - Cursor
        - DeepSeek
        - Devin
        - GitHub Copilot
        - Google (Antigravity / Gemini CLI)
        - Kimi Code
        - MiniMax
        - OpenAI
        - OpenRouter
        - xAI (Grok)
        - Z.ai
        - Zhipu GLM
        - Other
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs or Error Output
      description: Paste any sanitized error messages or logs. Ensure all secrets and tokens are redacted!
