services:
  usemeter:
    build:
      context: .
      dockerfile: Dockerfile
    image: usemeter:local
    restart: unless-stopped
    init: true
    ports:
      - "${USEMETER_BIND_ADDRESS:-127.0.0.1}:${USEMETER_PORT:-3100}:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      DATABASE_PATH: /app/data/usage.db
      USAGE_MASTER_KEY: ${USAGE_MASTER_KEY:?USAGE_MASTER_KEY must be set}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      KIMI_CODE_BASE_URL: ${KIMI_CODE_BASE_URL:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      ZAI_OAUTH_CLIENT_ID: ${ZAI_OAUTH_CLIENT_ID:-}
      ZAI_OAUTH_CLIENT_SECRET: ${ZAI_OAUTH_CLIENT_SECRET:-}
    volumes:
      - usemeter-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64m

volumes:
  usemeter-data:
